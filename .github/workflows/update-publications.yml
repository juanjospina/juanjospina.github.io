name: Update publications

on:
  schedule:
    - cron: "0 12 1 * *"   # 1st of every month
  workflow_dispatch:         # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Fetch Google Scholar and regenerate the Publications section
        run: python3 scripts/update_publications.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add index.html publications.json
          git diff --cached --quiet || { git commit -m "Update publications from Google Scholar"; git push; }
